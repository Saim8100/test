name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        id: deploy_config
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_APP_PATH: ${{ secrets.EC2_APP_PATH }}
        run: |
          missing=()
          [ -z "$EC2_HOST" ] && missing+=("EC2_HOST")
          [ -z "$EC2_USER" ] && missing+=("EC2_USER")
          [ -z "$EC2_SSH_KEY" ] && missing+=("EC2_SSH_KEY")
          [ -z "$EC2_SSH_PORT" ] && missing+=("EC2_SSH_PORT")
          [ -z "$EC2_APP_PATH" ] && missing+=("EC2_APP_PATH")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Skipping deploy. Missing secrets: ${missing[*]}"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: ${{ steps.deploy_config.outputs.should_deploy == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.EC2_APP_PATH }}
            git pull origin main
            docker compose up -d --build